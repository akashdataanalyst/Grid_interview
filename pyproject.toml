[project]
name = "grid_interview"
authors = [
    {name = "Calco PolyTechnik Pvt Ltd", email = "mis.1@calco.in"}
]
description = "Recruitment interview platform for Frappe v16: scheduling, candidate portal, embedded video, consent-based recording, transcription and human-reviewed AI reports"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
# boto3 is only imported when the S3 storage backend is enabled; PyJWT signs Jitsi tokens.
# The image layer installs them (uv pip install -e); the current base already has both.
dependencies = [
    "PyJWT>=2.8.0",
    "boto3>=1.34",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "grid_interview"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
